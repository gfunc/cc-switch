[package]
name = "cc-switch-web"
version = "3.10.3"
edition = "2021"
description = "Web server for CC Switch"
license = "MIT"

[dependencies]
# Axum web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (shared from main project)
rusqlite = { version = "0.33", features = ["bundled"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.16"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Shared types from main project
indexmap = { version = "2.7", features = ["serde"] }

# Async utilities
futures = "0.3"

# Environment
dotenvy = "0.15"
dirs = "5"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "cc-switch-web"
path = "src/main.rs"
