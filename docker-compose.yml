services:
  # Single-container web mode for Docker:
  # - Runs Rust API-only server (no desktop GUI/Xvfb runtime)
  # - Serves embedded web frontend assets directly from the same process
  backend-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        CARGO_FEATURES: "api-only"
    container_name: app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /host-home
      RUST_LOG: info
      CC_SWITCH_WEB_PORT: "3001"
      CC_SWITCH_WEB_BIND_ALL: "true"
      JWT_SECRET: "${JWT_SECRET:-cc-switch-dev-secret}"
      CC_SWITCH_ENABLE_TOKEN_REVEAL: "${CC_SWITCH_ENABLE_TOKEN_REVEAL:-true}"
    ports:
      - "${WEBSITE_PORT:-13001}:3001"
    volumes:
      - ${HOST_HOME:-~}:/host-home
      - ./src-tauri/db:/data/db
    command: /app/src-tauri/target/release/cc-switch
    restart: unless-stopped
